[project]
name = "workflow"
version = "1.0.0"
description = "约稿费用验收工作流 - 基于LangGraph的可复用工作流POC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.13",
    "langgraph>=0.2.59",
    "openpyxl>=3.1.0",
    "structlog>=24.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.scripts]
workflow = "workflow.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
