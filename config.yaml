# 工作流配置文件

workflow:
  name: "quotation-fee-workflow"
  version: "1.0.0"
  checkpoint_db: "checkpoints.db"

# 表格配置
tables:
  dir: "./table"
  required:
    - "3-媒体库"
    - "4-账户信息"
    - "5-费用"

# 存储配置
# Excel 产物实际走 workflows.paths：默认 output/<run_id>/，可用 WORKFLOW_OUTPUT_DIR 整段挪走。
# 运行库默认 runtime/workflow.db，可用 WORKFLOW_RUNTIME_DIR。MCP 进程默认改用 runtime-mcp / output-mcp。
storage:
  artifacts_dir: "./output"
  logs_dir: "./logs"
  max_artifact_size_mb: 100

# 日志配置
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "json"  # json, console
  output: "both"  # console, file, both

# MCP 观测服务（远端 Streamable HTTP，内网不鉴权）
mcp:
  host: "0.0.0.0"
  port: 8100
  path: "/mcp"
  transport: "streamable-http"

# LLM配置（当前未使用，预留）
llm:
  enabled: false
  # provider: "anthropic"
  # model: "claude-3-5-sonnet-20241022"
  # api_key: "your-api-key"
